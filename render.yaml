services:
  - type: web
    name: interview-summary
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build && npm run prisma:migrate --prefix server
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CLIENT_URL
        value: ""
